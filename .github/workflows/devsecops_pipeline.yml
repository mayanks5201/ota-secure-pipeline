name: Automotive OTA Security Scan

on: [push]

jobs:
  security_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SONARQUBE (Static Code Quality & Security)
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 2. SNYK (SCA & SAST)
      - name: Snyk Security Scan
        uses: snyk/actions/python-3.10@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3. TRIVY (Container Image Scan)
      - name: Build Image for Trivy
        run: docker build -t ota-service:${{ github.sha }} .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ota-service:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # 4. OWASP ZAP (DAST - Baseline Scan)
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://example.com' # Replace with your microservice URL once deployed
