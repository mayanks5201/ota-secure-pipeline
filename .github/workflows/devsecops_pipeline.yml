name: Automotive OTA Security Scan

on: [push]

jobs:
  security_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SONARQUBE (Static Analysis)
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=mayanks5201
            -Dsonar.projectKey=mayanks5201_ota-secure-pipeline

      # 2. SNYK (Dependency Scan) - Continue on error to see Trivy
      - name: Snyk Security Scan
        uses: snyk/actions/python-3.10@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3. BUILD DOCKER IMAGE
      - name: Build Image for Trivy
        run: docker build -t ota-service:${{ github.sha }} .

      # 4. TRIVY (Container Scan) - Continue on error to see ZAP
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'ota-service:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # 5. OWASP ZAP (DAST Baseline)
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://example.com'
